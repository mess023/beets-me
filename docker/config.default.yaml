# Default beets configuration for the singles pipeline container.
# Copied to /config/config.yaml on first start; edit there (or via the web UI
# at http://<host>:8338/plugins).

directory: /music/library
library: /config/library.db

# discogs, bandcamp and beatport4 are installed but off: enable them on the
# plugins page once their credentials are filled in (discogs needs a personal
# token, beatport4 a Beatport login and uses an unofficial API).
plugins:
  - musicbrainz
  - deezer
  - chroma
  - fromfilename
  - ftintitle
  - fetchart
  - embedart
  - autobpm
  - replaygain
  - convert
  - scrub
  - singles

import:
  move: yes
  write: yes
  # no confident online match: import anyway with the file's own tags so the
  # rest of the pipeline (AIFF, BPM, key, ReplayGain, month folder) still runs;
  # such items get match_source: none and can be re-matched from the web UI
  quiet_fallback: asis
  log: /config/import.log

match:
  # quiet mode only applies "strong" matches. A perfect singleton match scores
  # 0.0 with the weights below; 0.10 also accepts a small title variance such
  # as a missing "(Original Mix)" while an artist mismatch (>= 0.15) is refused.
  strong_rec_thresh: 0.10

paths:
  # "July 2025/Artist - Title (Remixer Remix).aiff"; no artist -> just the title
  singleton: $month_folder/%if{$artist,$artist - }$title%sunique{}
  default: $month_folder/%if{$artist,$artist - }$title%sunique{}
  comp: $month_folder/%if{$artist,$artist - }$title%sunique{}

singles:
  inbox: /music/inbox
  batch_size: 20
  auto_key: yes
  auto_art: yes

convert:
  auto: yes
  format: aiff
  never_convert_lossy_files: yes
  delete_originals: yes
  formats:
    aiff:
      command: to-aiff $source $dest
      extension: aiff

replaygain:
  auto: yes
  backend: ffmpeg
  overwrite: yes
  targetlevel: 89

autobpm:
  auto: yes

fetchart:
  auto: yes
  sources:
    - coverart
    - itunes
    - cover_art_url
    - amazon
    - albumart
    - spotify

embedart:
  auto: yes
  remove_art_file: yes

chroma:
  auto: yes

musicbrainz:
  search_limit: 10
  # MusicBrainz is the reference source: no data_source penalty, otherwise a
  # perfect singleton match already scores 0.111 and is never "strong".
  source_weight: 0.0

deezer:
  # 0.3 -> floor 0.067: a perfect Deezer match still counts as strong when
  # MusicBrainz has nothing, but MusicBrainz wins when both match.
  source_weight: 0.3

# Sonovault (DJ catalogue: BPM, Camelot key, genre, label): paste your own
# API key on the services page; the plugin is enabled there once a key is set.
sonovault:
  apikey: ""

