<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Singles{% endblock %} · beets</title>
<script>
  // Theme before first paint: stored choice, else system preference, else dark.
  (function () {
    var t = "dark";
    try { t = localStorage.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      beets singles
    </span>
    <nav aria-label="Hoofdnavigatie">
      <a href="{{ url_for('dashboard') }}" {% if page=='dashboard' %}aria-current="page"{% endif %}>Verwerken</a>
      <a href="{{ url_for('plugins_page') }}" {% if page=='plugins' %}aria-current="page"{% endif %}>Diensten</a>
    </nav>
    <button class="theme-toggle" id="theme" type="button" role="switch" aria-checked="false" title="Wissel tussen donker en licht thema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span id="theme_label">Thema: donker</span>
    </button>
  </div>
</header>
<main class="container">
{% block body %}{% endblock %}
</main>
<script>
  (function () {
    var b = document.getElementById("theme"), l = document.getElementById("theme_label");
    function show() { var light = document.documentElement.dataset.theme === "light"; l.textContent = "Thema: " + (light ? "licht" : "donker"); b.setAttribute("aria-checked", light); }
    b.addEventListener("click", function () {
      var t = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      try { localStorage.theme = t; } catch (e) {}
      show();
    });
    show();
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
