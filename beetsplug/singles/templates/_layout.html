<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}beets singles{% endblock %}</title>
<style>
  body{font:14px/1.45 system-ui,sans-serif;margin:0;background:#f6f6f6;color:#222}
  header{background:#222;color:#fff;padding:.6rem 1rem;display:flex;gap:1.2rem;align-items:center}
  header a{color:#fff;text-decoration:none}header a.active{text-decoration:underline}
  main{max-width:1000px;margin:1rem auto;padding:0 1rem}
  .card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:1rem;margin-bottom:1rem}
  table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:.35rem .5rem;text-align:left;vertical-align:top}
  pre{background:#111;color:#ddd;padding:.7rem;max-height:40vh;overflow:auto;font-size:12px}
  input[type=text],input[type=password],input[type=number]{padding:.25rem .4rem;border:1px solid #bbb;border-radius:4px}
  button{padding:.4rem .9rem;border:0;border-radius:4px;background:#2a6;color:#fff;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  button.stop{background:#c33}
  .status{font-weight:600}.ok{color:#2a6}
  abbr{text-decoration:underline dotted;cursor:help}
  .muted{color:#777}
</style>
</head>
<body>
<header>
  <strong>beets</strong>
  <a href="/">Bibliotheek</a>
  <a href="{{ url_for('singles.dashboard') }}" class="{{ 'active' if page=='dashboard' }}">Singles-batch</a>
  <a href="{{ url_for('singles.plugins_page') }}" class="{{ 'active' if page=='plugins' }}">Plugins &amp; diensten</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
